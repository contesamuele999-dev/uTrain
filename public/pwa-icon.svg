<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4" />

  <!-- Subtle glow orb -->
  <circle cx="256" cy="256" r="160" fill="url(#glow-grad)" opacity="0.18" filter="url(#glow)" />

  <!-- Center Symbol: Stylized U + Dumbbell + Energy Spark -->
  <g transform="translate(0, 0)">
    <!-- Dumbbell Bar -->
    <path d="M150 256 L362 256" stroke="url(#accent-grad)" stroke-width="28" stroke-linecap="round" />
    
    <!-- Left Weight Plates -->
    <rect x="120" y="176" width="30" height="160" rx="15" fill="#10b981" filter="url(#glow)" />
    <rect x="90" y="200" width="22" height="112" rx="11" fill="#34d399" />

    <!-- Right Weight Plates -->
    <rect x="362" y="176" width="30" height="160" rx="15" fill="#10b981" filter="url(#glow)" />
    <rect x="400" y="200" width="22" height="112" rx="11" fill="#34d399" />

    <!-- Central Energy Lightning / Overload Spark -->
    <path d="M268 136 L224 246 L278 246 L244 376 L308 236 L254 236 Z" 
          fill="#38bdf8" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linejoin="round"
          filter="url(#glow)" />
  </g>
</svg>
